[custom]
enable_rule_generator=true
overwrite_original_rules=true
append_proxy_type=true

; Temporary compatibility probe for the EdgeTunnel SUBCONFIG field.
; After confirming the selected backend returns this group, replace this file
; with the full profile tailored to that backend's supported extensions.
custom_proxy_group=Node-Selection`select`[]DIRECT`[]REJECT`[]Manual-Select
custom_proxy_group=Manual-Select`select`.*
custom_proxy_group=AI`select`[]Node-Selection`[]DIRECT`[]REJECT`[]Manual-Select
custom_proxy_group=Leak-Fish`select`[]Node-Selection`[]DIRECT`[]REJECT`[]Manual-Select
custom_proxy_group=TEST-CONFIG-ROUNDTRIP`select`[]AI

ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AI/AI.list
ruleset=Leak-Fish,[]FINAL
