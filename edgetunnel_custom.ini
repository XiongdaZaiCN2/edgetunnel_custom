[custom]
; External Subconverter profile for EdgeTunnel.
; Test groups use Google's 204 endpoint once per day; no Cloudflare speed-test endpoint is used.
enable_rule_generator=true
overwrite_original_rules=true

; Main controls: select regional testing manually; all-node selectors do not run tests.
custom_proxy_group=🚀 节点总控`select`[]🌐 全部节点（不测速）`[]🧭 地区测速选择`[]🧪 精选源测速`[]🛟 精选源故障转移`[]⚖️ 精选源负载均衡`[]🌍 多国家随机池（不测速）`[]🌍 全部国家手选`[]DIRECT
custom_proxy_group=🌐 全部节点（不测速）`select`.*
custom_proxy_group=🧭 地区测速选择`select`[]🧪 美国 低频测速`[]🧪 加拿大 低频测速`[]🧪 英国 低频测速`[]🧪 德国 低频测速`[]🧪 香港 低频测速`[]🧪 台湾 低频测速`[]🧪 新加坡 低频测速`[]🧪 日本 低频测速`[]🧪 韩国 低频测速`[]🧪 澳大利亚 低频测速
