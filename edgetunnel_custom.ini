; Curated non-random source pool; periodic checks are limited to once every 24 hours.
custom_proxy_group=🧪 精选源测速`url-test`^(?!.*地区随机).*$`https://www.gstatic.com/generate_204`86400,5,150
custom_proxy_group=🛟 精选源故障转移`fallback`^(?!.*地区随机).*$`https://www.gstatic.com/generate_204`86400,5
custom_proxy_group=⚖️ 精选源负载均衡`load-balance`^(?!.*地区随机).*$`https://www.gstatic.com/generate_204`86400,,150

